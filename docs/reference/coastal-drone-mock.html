<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coastal Drone Surveillance: Interface Mock</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Hanken Grotesk"','system-ui','sans-serif']},
colors:{paper:'var(--paper)',panel:'var(--panel)',ink:'var(--ink)',mute:'var(--mute)',line:'var(--line)',shoal:'var(--shoal)',sea:'var(--sea)',land:'var(--land)',red:'var(--red)',amber:'var(--amber)',green:'var(--green)'}}}}
</script>
<style>
:root{--paper:#F1F4F2;--panel:#FFFFFF;--ink:#10283A;--mute:#5B7080;--line:#D3DDDD;--shoal:#CFE3E6;--sea:#1F5C73;--land:#E7E2D0;--red:#C9382C;--amber:#C98F0E;--green:#2E8B6A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0D1B24;--panel:#132835;--ink:#E4EEF0;--mute:#8CA4B1;--line:#26404E;--shoal:#16323F;--sea:#6FB6CC;--land:#1D2B29;--red:#F0685B;--amber:#E5B13D;--green:#4DBB95;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0D1B24;--panel:#132835;--ink:#E4EEF0;--mute:#8CA4B1;--line:#26404E;--shoal:#16323F;--sea:#6FB6CC;--land:#1D2B29;--red:#F0685B;--amber:#E5B13D;--green:#4DBB95;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.vid{background:#0B1A22}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:26;opacity:0}}
.ring{animation:pulse 1.8s ease-out infinite}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.toast{animation:slide .25s ease-out}
@media (prefers-reduced-motion:reduce){.ring,.toast{animation:none}}
</style>
</head>
<body class="font-sans">
<div class="h-full flex flex-col">
  <div id="view" class="flex-1 min-h-0 overflow-auto"></div>
  <footer id="bar" class="shrink-0 border-t border-line bg-panel px-4 py-2 flex items-center gap-3 text-sm"></footer>
</div>
<div id="toasts" class="fixed right-4 top-16 z-50 space-y-2"></div>

<script>
const S={step:0,alert:false,audit:[['19:27','System','Alert V-0231 raised, rule Z04-dwell']]};
let uid=0;

/* ---------- drawing helpers ---------- */
const box=(x,y,w,h,l,c,k)=>{
  const cx=x+w/2,cy=y+h/2;
  const shape=k==='p'?`<circle cx="${cx}" cy="${cy}" r="2.4" fill="#f2e6cf"/>`:`<ellipse cx="${cx}" cy="${cy}" rx="${w/2.8}" ry="${h/3.4}" fill="#e8eef0"/><path d="M${cx-w/2.8-6} ${cy+3}q-8 3 -14 8" stroke="#ffffff55" fill="none"/>`;
  return `${shape}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${c}" stroke-width="1.2"/><rect x="${x}" y="${y-9}" width="${l.length*3.7+6}" height="9" fill="${c}"/><text x="${x+3}" y="${y-2}" font-size="6.5" fill="#fff" font-weight="600">${l}</text>`;
};
const scene=(items,sand,o={})=>{const id='g'+(++uid);return `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" class="w-full h-full"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d6178"/><stop offset="1" stop-color="#0c3144"/></linearGradient></defs><rect width="320" height="180" fill="url(#${id})"/><path d="M0 60q80-14 160 0t160-6M0 100q90 12 170 0t150 8" stroke="#ffffff1c" fill="none"/>${sand?'<path d="M0 128C60 116 120 142 190 130S290 120 320 134V180H0Z" fill="#b8a780"/><path d="M0 128C60 116 120 142 190 130S290 120 320 134" stroke="#ffffff55" fill="none"/>':''}${o.zone?'<polygon points="90,40 250,34 262,112 100,120" fill="#C9382C22" stroke="#ff8a7d" stroke-dasharray="4 3"/>':''}${items.map(i=>box(...i)).join('')}</svg>`};
const sceneA=()=>scene([[142,62,48,24,'Vessel V-0231 94%','#C9382C','b'],[40,30,30,14,'Boat 91%','#2E8B6A','b'],[230,138,12,12,'Person','#2E8B6A','p']],1,{zone:1});
const sceneB=()=>scene([[60,140,10,10,'Person','#2E8B6A','p'],[80,146,10,10,'Person','#2E8B6A','p'],[100,140,10,10,'Person','#2E8B6A','p'],[130,150,10,10,'Person','#C98F0E','p'],[170,134,34,16,'Vehicle','#2E8B6A','b']],1);
const sceneC=()=>scene([[50,50,34,16,'Boat 93%','#2E8B6A','b'],[140,90,38,18,'Boat 90%','#2E8B6A','b'],[230,40,30,14,'Boat 88%','#2E8B6A','b']],1);
const sceneD=()=>scene([[110,70,36,16,'Vessel 92%','#2E8B6A','b']],0);

const map=(o={})=>`<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" class="w-full h-full" role="img" aria-label="Chart of the Kochi coast with drones, zones and events">
<rect width="600" height="400" fill="var(--shoal)"/>
<path d="M0 0H215C192 60 238 92 216 150S172 232 202 292 176 362 192 400H0Z" fill="var(--land)"/>
<path d="M215 0C192 60 238 92 216 150S172 232 202 292 176 362 192 400" fill="none" stroke="var(--sea)" stroke-width="1.6"/>
<path d="M245 0C222 60 268 92 246 150S203 232 232 292 207 362 222 400" fill="none" stroke="var(--sea)" stroke-width=".8" stroke-dasharray="2 5"/>
<path d="M300 0V400M400 0V400M500 0V400M0 100H600M0 200H600M0 300H600" stroke="var(--sea)" stroke-opacity=".15"/>
<text x="40" y="90" font-size="12" fill="var(--mute)" font-style="italic">Munambam</text><text x="30" y="250" font-size="12" fill="var(--mute)" font-style="italic">Cherai</text><text x="40" y="360" font-size="12" fill="var(--mute)" font-style="italic">Fort Kochi</text>
<g font-size="10" font-weight="600">
<polygon points="330,150 420,140 442,222 340,238" fill="var(--red)" fill-opacity=".12" stroke="var(--red)" stroke-dasharray="6 4" stroke-width="1.5"/><text x="338" y="166" fill="var(--red)">Z-04 Restricted anchorage</text>
<polygon points="218,240 284,234 292,312 206,322" fill="var(--amber)" fill-opacity=".14" stroke="var(--amber)" stroke-dasharray="6 4" stroke-width="1.5"/><text x="226" y="256" fill="var(--amber)">Z-02 Beach crowd</text>
${o.quiet?'':'<polygon points="236,336 300,330 306,388 226,392" fill="var(--sea)" fill-opacity=".1" stroke="var(--sea)" stroke-dasharray="6 4" stroke-width="1.5"/><text x="244" y="350" fill="var(--sea)">Z-07 Harbour mouth</text>'}</g>
${o.quiet?'':`<path d="M250 380C270 320 300 250 330 190S380 90 360 70" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 4"/>
<g transform="translate(360 70) rotate(214)"><path d="M0-11L8 9 0 5-8 9Z" fill="var(--ink)"/></g><text x="372" y="66" font-size="11" font-weight="700" fill="var(--ink)">KP-D07</text>
<g transform="translate(232 288)"><path d="M0-9L7 8 0 4-7 8Z" fill="var(--sea)"/></g><text x="244" y="292" font-size="11" font-weight="700" fill="var(--sea)">KP-D12</text>
<g transform="translate(250 372)"><path d="M0-9L7 8 0 4-7 8Z" fill="var(--sea)"/></g><text x="262" y="376" font-size="11" font-weight="700" fill="var(--sea)">KP-D03</text>
<circle cx="258" cy="276" r="3" fill="var(--amber)"/><circle cx="266" cy="270" r="3" fill="var(--amber)"/><circle cx="252" cy="268" r="3" fill="var(--amber)"/>
<circle cx="500" cy="300" r="4" fill="var(--green)"/><circle cx="470" cy="120" r="4" fill="var(--green)"/>
${S.alert?'<circle class="ring" cx="386" cy="188" r="6" fill="none" stroke="var(--red)" stroke-width="2"/><circle cx="386" cy="188" r="6" fill="var(--red)"/>':''}`}
</svg>`;

/* ---------- shell ---------- */
const NAV=[['ops','Watch floor'],['wall','Feed wall'],['incident','Incidents'],['zones','Zones and rules'],['models','Models and health']];
const shell=(cur,body)=>`<div class="h-full flex"><nav class="hidden md:flex w-52 shrink-0 flex-col border-r border-line bg-panel py-4">
<div class="px-5 pb-5"><div class="text-[15px] font-bold leading-tight">Coastal Watch</div><div class="text-xs text-mute">Kerala Police</div></div>
${NAV.map(([k,l])=>`<button onclick="nav('${k}')" class="text-left px-5 py-2 text-sm border-l-4 ${k===cur?'border-sea font-semibold bg-shoal':'border-transparent text-mute hover:text-ink'}">${l}</button>`).join('')}
<div class="mt-3 px-5 py-1 text-sm text-mute">Archive and playback</div><div class="px-5 py-1 text-sm text-mute">Reports</div><div class="px-5 py-1 text-sm text-mute">Users and audit</div>
<div class="mt-auto px-5 text-xs text-mute">Demo data only</div></nav>
<div class="flex-1 min-w-0 flex flex-col"><header class="h-12 shrink-0 border-b border-line bg-panel px-4 flex items-center gap-4 text-sm">
<span class="font-semibold">Kochi sector</span><span class="text-mute">16 Oct 2026, 19:42 IST</span>
<span class="ml-auto flex items-center gap-1.5"><i class="w-2 h-2 rounded-full bg-green"></i>18 of 20 feeds live</span>
<span class="px-2 py-0.5 rounded bg-shoal text-xs font-semibold">Supervisor: N. Menon</span></header>
<main class="flex-1 min-h-0 overflow-auto">${body}</main></div></div>`;

/* ---------- screens ---------- */
const alerts=()=>{const a=[];
 if(S.alert)a.push(['red','High','Unregistered vessel loitering in Z-04','Munambam, 14 min, KP-D07','19:41',1]);
 a.push(['amber','Medium','Crowd of 62 on Cherai beach (limit 50)','KP-D12','19:33',0],['amber','Medium','Stationary object on Fort Kochi jetty, 22 min','KP-D03','19:12',0],['green','Info','Zone Z-07 clear after vessel departure','KP-D03','18:50',0]);
 return a.map(([c,s,t,m,tm,go])=>`<li><button onclick="${go?"nav('incident')":"toast('Opens the same review screen')"}" class="w-full text-left px-4 py-3 border-l-4 border-${c} hover:bg-shoal flex gap-3"><span class="min-w-0 flex-1"><span class="block text-sm font-semibold leading-snug">${t}</span><span class="block text-xs text-mute mt-0.5">${s} severity, ${m}</span></span><span class="text-xs text-mute">${tm}</span></button></li>`).join('')};

const screens={
login(){return `<div class="h-full grid lg:grid-cols-[1.15fr_1fr]"><div class="relative hidden lg:block">${map({quiet:1})}
<div class="absolute left-10 bottom-10 max-w-md"><h1 class="text-3xl font-bold leading-tight">One watch floor for every drone on the coast.</h1><p class="mt-2 text-mute">Live video, AI detections and chart positions, kept together and kept on the record.</p></div></div>
<div class="flex items-center justify-center p-8"><div class="w-full max-w-sm"><div class="text-lg font-bold">Sign in to Coastal Watch</div><p class="text-sm text-mute mt-1">Your role decides what you can view, export and change.</p>
<div class="mt-5 grid grid-cols-2 gap-2" id="roles">${['Operator','Analyst','Supervisor','Administrator'].map((r,i)=>`<button onclick="role(this)" class="border border-line rounded px-3 py-2 text-sm text-left ${i==2?'bg-ink text-paper border-ink':'bg-panel'}">${r}</button>`).join('')}</div>
<label class="block mt-4 text-sm font-medium">Police ID<input class="mt-1 w-full border border-line bg-panel rounded px-3 py-2" value="KP-CP-20418"></label>
<label class="block mt-3 text-sm font-medium">Password<input type="password" class="mt-1 w-full border border-line bg-panel rounded px-3 py-2" value="demo-password"></label>
<div class="mt-3 text-sm font-medium">Verification code</div><div class="mt-1 flex gap-2">${[4,8,1,5,9,2].map(n=>`<span class="w-10 h-11 grid place-items-center border border-line bg-panel rounded font-semibold">${n}</span>`).join('')}</div>
<button onclick="next()" class="mt-5 w-full rounded bg-sea text-white font-semibold py-2.5">Sign in</button>
<p class="mt-3 text-xs text-mute">This session is recorded for audit. Authorised use only.</p></div></div></div>`},

ops(){return shell('ops',`<div class="h-full grid xl:grid-cols-[1fr_380px] min-h-[560px]"><section class="relative border-r border-line min-h-[420px]">${map()}
<div class="absolute left-3 top-3 flex gap-2 text-sm">${['KP-D07','KP-D12','KP-D03'].map((d,i)=>`<button class="px-3 py-1.5 rounded border border-line ${i==0?'bg-ink text-paper':'bg-panel'}">${d}</button>`).join('')}</div>
<div class="absolute right-3 top-3 bg-panel border border-line rounded p-2 text-xs space-y-1"><label class="flex gap-2"><input type="checkbox" checked>Zones</label><label class="flex gap-2"><input type="checkbox" checked>Flight tracks</label><label class="flex gap-2"><input type="checkbox" checked>Detections</label></div>
<div class="absolute left-3 bottom-3 bg-panel border border-line rounded px-3 py-2 text-xs flex gap-4"><span><i class="inline-block w-2 h-2 rounded-full bg-red mr-1"></i>Alert</span><span><i class="inline-block w-2 h-2 rounded-full bg-amber mr-1"></i>Crowd</span><span><i class="inline-block w-2 h-2 rounded-full bg-green mr-1"></i>Vessel, normal</span></div></section>
<aside class="flex flex-col min-h-0 bg-panel"><div class="vid relative aspect-video">${sceneA()}<div class="absolute left-2 top-2 text-[11px] text-white font-semibold bg-black/50 px-2 py-0.5 rounded">KP-D07 Munambam, live</div><div class="absolute right-2 top-2 text-[11px] text-white flex items-center gap-1"><i class="w-2 h-2 rounded-full bg-red"></i>REC</div></div>
<dl class="grid grid-cols-4 text-center border-b border-line">${[['Altitude','118 m'],['Heading','214°'],['Speed','9.4 m/s'],['Battery','62%']].map(([k,v])=>`<div class="py-2 border-r border-line last:border-0"><dd class="font-bold">${v}</dd><dt class="text-xs text-mute">${k}</dt></div>`).join('')}</dl>
<div class="px-4 py-2 flex items-center border-b border-line"><span class="font-semibold text-sm">Alert queue</span><button onclick="toast('Filters: severity, drone, zone, time')" class="ml-auto text-xs text-sea font-semibold">Filter</button></div>
<ul class="flex-1 overflow-auto divide-y divide-line">${alerts()}</ul></aside></div>`)},

wall(){const t=[['KP-D07 Munambam',sceneA,1],['KP-D12 Cherai',sceneB,1],['KP-D03 Fort Kochi',sceneC,0],['KP-D15 Vypin',sceneD,0],['KP-D09 Kodungallur',sceneC,0],['KP-D04 Azhikode',sceneB,0],['KP-D11 Chellanam',sceneD,0],['KP-D02 Njarakkal',sceneC,0],['Recorded: 14 Oct patrol',sceneD,0]];
return shell('wall',`<div class="p-4"><div class="flex items-center mb-3"><h2 class="text-lg font-bold">Feed wall</h2><span class="ml-3 text-sm text-mute">Showing 9 of 18 live feeds. Capacity 20, expandable.</span><div class="ml-auto flex gap-1 text-sm">${['3 by 3','2 by 2','1 by 1'].map((g,i)=>`<button class="px-3 py-1 rounded border border-line ${i==0?'bg-ink text-paper':'bg-panel'}">${g}</button>`).join('')}</div></div>
<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-3">${t.map(([n,f,a])=>`<button onclick="${a?"nav('incident')":"toast('Opens full-screen feed with telemetry')"}" class="text-left"><div class="vid relative aspect-video overflow-hidden rounded-sm">${f()}<span class="absolute left-2 top-2 text-[11px] text-white font-semibold bg-black/50 px-2 py-0.5 rounded">${n}</span>${a?'<span class="absolute right-2 top-2 text-[11px] font-bold text-white bg-red px-2 py-0.5 rounded">1 alert</span>':''}</div></button>`).join('')}</div></div>`)},

incident(){return shell('incident',`<div class="grid xl:grid-cols-[1fr_400px] min-h-full"><section class="p-4 min-w-0"><div class="text-sm text-mute">Incident 2026-1016-0417</div><h2 class="text-xl font-bold leading-snug">Unregistered vessel loitering in Z-04 Restricted anchorage</h2>
<div class="vid relative aspect-video mt-3 rounded-sm overflow-hidden">${sceneA()}<span class="absolute left-2 top-2 text-[11px] text-white bg-black/50 px-2 py-0.5 rounded">KP-D07, 19:27:08 to 19:41:36</span></div>
<div class="mt-3 relative h-10 bg-shoal rounded"><div class="absolute inset-y-0 left-0 w-[62%] bg-sea rounded-l opacity-30"></div><div class="absolute inset-y-0 left-[18%] w-[44%] border-x-2 border-red"></div><i class="absolute top-0 bottom-0 left-[62%] w-0.5 bg-ink"></i>
<span class="absolute left-[18%] -top-5 text-xs text-red font-semibold">Entered zone</span><span class="absolute left-[40%] top-2.5 text-xs">Dwell 14 min</span></div>
<div class="mt-2 flex gap-2 text-sm"><button class="px-3 py-1 rounded border border-line bg-panel">Play</button><button class="px-3 py-1 rounded border border-line bg-panel">Step frame</button><button class="px-3 py-1 rounded border border-line bg-panel">Show track on chart</button></div>
<h3 class="mt-6 font-semibold">Record of actions</h3><ol id="audit" class="mt-2 text-sm divide-y divide-line border-y border-line">${auditHTML()}</ol></section>
<aside class="border-l border-line bg-panel p-4"><div class="flex items-center gap-2"><span class="px-2 py-0.5 rounded bg-red text-white text-xs font-bold">High</span><span class="text-sm text-mute">Detected 19:27, 94% confidence</span></div>
<dl class="mt-4 text-sm grid grid-cols-[110px_1fr] gap-y-2">${[['Object','Vessel, track V-0231'],['Position','10°10′46″N 76°10′22″E'],['Drone','KP-D07 Munambam Patrol 2'],['Altitude, speed','118 m, 9.4 m/s'],['Heading','214°'],['Rule','Dwell over 10 min in Z-04, 18:00 to 06:00']].map(([k,v])=>`<dt class="text-mute">${k}</dt><dd class="font-medium">${v}</dd>`).join('')}</dl>
<div class="mt-4 p-3 rounded bg-shoal text-xs"><div class="font-semibold">Evidence sealed</div><div class="mt-1 break-all text-mute">SHA-256 9f2c…a41e, stored 19:41:40, 3 clips and 12 stills</div></div>
<div class="mt-4 grid gap-2 text-sm font-semibold"><button onclick="act('Request patrol boat from Munambam Coastal Station')" class="rounded bg-sea text-white py-2.5">Request patrol boat</button><button onclick="act('Escalated to Station House Officer, Munambam')" class="rounded border border-line py-2.5">Escalate to station</button><button onclick="act('Acknowledged by N. Menon')" class="rounded border border-line py-2.5">Acknowledge</button><button onclick="act('Evidence pack exported with hash manifest')" class="rounded border border-line py-2.5">Export evidence pack</button></div></aside></div>`)},

zones(){return shell('zones',`<div class="h-full grid xl:grid-cols-[240px_1fr_380px] min-h-[560px]"><aside class="border-r border-line bg-panel p-3 text-sm"><div class="font-semibold mb-2">Zones</div>
${[['Z-04','Restricted anchorage','red',1],['Z-02','Beach crowd limit','amber',0],['Z-07','Harbour mouth','sea',0]].map(([i,n,c,a])=>`<button class="w-full text-left px-3 py-2 border-l-4 border-${c} ${a?'bg-shoal':''}"><span class="font-semibold">${i}</span> ${n}</button>`).join('')}<button onclick="toast('Draw on chart, double-click to finish')" class="mt-3 w-full rounded border border-dashed border-line py-2 text-sea font-semibold">Draw new zone</button></aside>
<section class="relative border-r border-line">${map()}<div class="absolute left-3 top-3 bg-panel border border-line rounded px-3 py-1.5 text-xs">Editing Z-04. Drag corners to reshape.</div></section>
<aside class="bg-panel p-4"><h2 class="font-bold">Rule for Z-04</h2><p class="text-sm text-mute mt-1">Written as a sentence. No code needed.</p>
<div class="mt-4 text-[15px] leading-9">Raise an alert when a ${sel(['vessel','person','vehicle','any object'])} stays inside ${sel(['Z-04','Z-02','Z-07'])} for more than ${sel(['10 min','5 min','20 min'])} between ${sel(['18:00 and 06:00','All day'])}. Mark it ${sel(['High','Medium','Low'])} and notify ${sel(['Munambam Station SHO','Coastal control room'])}. If nobody acknowledges within ${sel(['5 min','2 min','10 min'])}, escalate to ${sel(['DySP Coastal','Control room supervisor'])}.</div>
<div class="mt-4 text-sm"><div class="font-semibold">Sensitivity</div><input type="range" class="w-full mt-1" value="70"><div class="flex justify-between text-xs text-mute"><span>Fewer alerts</span><span>More alerts</span></div></div>
<div class="mt-4 p-3 rounded bg-shoal text-xs">Replayed on last 7 days of footage: this rule would have raised 4 alerts.</div>
<button onclick="toast('Rule saved. Change logged in audit.')" class="mt-4 w-full rounded bg-sea text-white font-semibold py-2.5">Save rule</button></aside></div>`)},

models(){const r=[['coastal-detect','v3.2','0.91','Production','green','Approved by DySP Coastal HQ, 02 Oct'],['vessel-behaviour','v1.4','0.87','Staging','amber','Testing on Munambam footage'],['thermal-night','v0.9','0.78','Awaiting approval','red','Needs authority sign-off']];
const b=(l,v,c)=>`<div class="mt-3"><div class="flex justify-between text-sm"><span>${l}</span><span class="font-semibold">${v}</span></div><div class="h-2 bg-shoal rounded mt-1"><div class="h-2 rounded bg-${c}" style="width:${v}%"></div></div></div>`;
return shell('models',`<div class="p-4 grid xl:grid-cols-[1fr_360px] gap-6"><section><h2 class="text-lg font-bold">Model registry</h2><p class="text-sm text-mute">Nothing goes live without sign-off from the designated authority.</p>
<table class="w-full mt-3 text-sm"><thead class="text-left text-mute border-b border-line"><tr><th class="py-2">Model</th><th>Version</th><th>Score (F1)</th><th>Stage</th></tr></thead><tbody class="divide-y divide-line">${r.map(([n,v,s,st,c,note])=>`<tr><td class="py-3"><div class="font-semibold">${n}</div><div class="text-xs text-mute">${note}</div></td><td>${v}</td><td>${s}</td><td><span class="px-2 py-0.5 rounded text-xs font-semibold text-white bg-${c}">${st}</span></td></tr>`).join('')}</tbody></table>
<div class="mt-5 flex gap-2 text-sm font-semibold"><button onclick="toast('Compare v3.2 and v3.3 on the same test set')" class="rounded border border-line bg-panel px-4 py-2">Compare versions</button><button onclick="toast('Request sent to designated authority')" class="rounded bg-sea text-white px-4 py-2">Request approval to promote</button></div>
<div class="mt-6 text-sm"><div class="font-semibold">Dataset</div><p class="text-mute">4,812 annotated frames from authorised patrols. 3 new classes pending: dhow, jet ski, fishing net.</p></div></section>
<aside class="bg-panel border border-line rounded p-4"><h2 class="font-bold">System health</h2>${b('Feeds live (18 of 20)','90','sea')}${b('GPU load','71','amber')}${b('Storage used','63','sea')}${b('Alert delivery success','99','green')}
<dl class="mt-4 text-sm grid grid-cols-2 gap-y-2"><dt class="text-mute">Inference delay</dt><dd class="font-semibold">180 ms</dd><dt class="text-mute">Last backup</dt><dd class="font-semibold">03:00 today</dd><dt class="text-mute">Uptime, 30 days</dt><dd class="font-semibold">99.96%</dd></dl></aside></div>`)}
};
const sel=o=>`<select class="border-b-2 border-sea bg-shoal rounded-t px-1 font-semibold">${o.map(x=>`<option>${x}</option>`).join('')}</select>`;
const auditHTML=()=>S.audit.map(([t,w,a])=>`<li class="py-2 flex gap-3"><span class="text-mute w-12">${t}</span><span class="w-24 font-medium">${w}</span><span class="flex-1">${a}</span></li>`).join('');

/* ---------- guided demo ---------- */
const steps=[
 {s:'login',t:'Sign in',n:'Role-based access with a second factor. Every session is recorded.'},
 {s:'ops',t:'Watch floor',n:'Chart, live video and telemetry together. Three drones on patrol.'},
 {s:'ops',t:'Alert raised',n:'A vessel overstays in a restricted zone. The alert appears on the chart and in the queue.',on(){if(!S.alert){S.alert=true;setTimeout(()=>toast('High alert: vessel loitering in Z-04'),500)}}},
 {s:'incident',t:'Review incident',n:'Evidence is sealed with a hash. Every action is written to the record.'},
 {s:'wall',t:'Feed wall',n:'Nine feeds at once, scaling to 20 and beyond.'},
 {s:'zones',t:'Zones and rules',n:'Operators write rules as sentences. No developer needed.'},
 {s:'models',t:'Models and health',n:'Model changes need authority approval. Health is visible at a glance.'}];
function render(){const st=steps[S.step];S.alert=S.alert||S.step>2;if(st.on)st.on();
 document.getElementById('view').innerHTML=screens[st.s]();
 document.getElementById('bar').innerHTML=`<button onclick="prev()" class="px-3 py-1 rounded border border-line" ${S.step?'':'disabled style="opacity:.4"'}>Back</button>
 <div class="flex-1 min-w-0"><div class="font-semibold">Step ${S.step+1} of ${steps.length}: ${st.t}</div><div class="text-mute text-xs truncate">${st.n}</div></div>
 <button onclick="next()" class="px-4 py-1.5 rounded bg-ink text-paper font-semibold" ${S.step<steps.length-1?'':'disabled style="opacity:.4"'}>Next step</button>`}
const next=()=>{if(S.step<steps.length-1){S.step++;render()}};
const prev=()=>{if(S.step>0){S.step--;render()}};
const nav=k=>{const i=steps.findIndex((x,j)=>x.s===k&&(k!=='ops'||j===(S.alert?2:1)));S.step=i<0?1:i;render()};
function toast(m){const d=document.createElement('div');d.className='toast bg-ink text-paper text-sm px-4 py-2 rounded shadow-lg max-w-xs';d.textContent=m;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}
function act(a){const n=new Date();S.audit.push(['19:43','N. Menon',a]);document.getElementById('audit').innerHTML=auditHTML();toast(a)}
function role(b){document.querySelectorAll('#roles button').forEach(x=>x.className='border border-line rounded px-3 py-2 text-sm text-left bg-panel');b.className='border rounded px-3 py-2 text-sm text-left bg-ink text-paper border-ink'}
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
render();
</script>
</body>
